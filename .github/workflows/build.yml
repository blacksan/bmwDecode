name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BmwDecode.slnx

      - name: Build
        run: dotnet build BmwDecode.slnx -c Release --no-restore

      - name: Test
        run: dotnet test BmwDecode.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish (self-contained single exe, win-x64)
        run: >
          dotnet publish src/BmwDecode.App/BmwDecode.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o publish

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE.md publish/
          Compress-Archive -Path publish/* -DestinationPath bmwDecode-win-x64.zip

      - name: "Installer (public build: app only, no BMW data)"
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=0.2.${{ github.run_number }}" "/DPublishDir=$pwd\publish" "/DOutputDir=$pwd\artifacts" installer\bmwDecode.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: bmwDecode-win-x64
          path: bmwDecode-win-x64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: bmwDecode-setup
          path: artifacts/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bmwDecode-win-x64.zip
            artifacts/*.exe
